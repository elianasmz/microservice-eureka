server:
  port: 8761
#  servlet:
#    context-path: /eureka

spring:
  application:
    name: microservice-eureka
  cloud:
    config:
      enabled: false

eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000