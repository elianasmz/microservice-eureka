#server:
  #port: 8761


spring:
  application:
    name: microservice-eureka
  #config:
    #import: optional:configserver:http://localhost:8888
  cloud:
    config:
      enabled: false


eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:9090/eureka/eureka/
